services:
  - type: web
    name: aptitude-backend-1
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: FRONTEND_ORIGIN
        value: https://aptitude-frontend-1.onrender.com
      - key: DATABASE_URL
        sync: false

  - type: web
    name: aptitude-frontend-1
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        value: https://aptitude-backend-1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html